<section class="resume-section" id="experience">
    <div class="resume-section-content">
        <h2 class="mb-5">Research Experience</h2>

        {% for item in site.data.experience.experience %}
        <div class="d-flex flex-column flex-md-row justify-content-between {% if forloop.last == false %} mb-5 {% endif %}">
            <div class="resume-logo{% unless item.logo %} resume-logo--empty{% endunless %}">
                {% if item.logo %}
                {% if item.institution-website %}<a href="{{ item.institution-website }}">{% endif %}<img src="{{ site.baseurl }}/{{ item.logo }}" alt="{{ item.institution | default: item.company }} logo" loading="lazy" />{% if item.institution-website %}</a>{% endif %}
                {% endif %}
            </div>
            <div class="flex-grow-1">
                <h3 class="mb-0">{{ item.title }}</h3>
                <div class="subheading mb-3">{{ item.company }}</div>
                <p>{{ item.description }}</p>
            </div>
            <div class="flex-shrink-0"><span class="text-primary">{{ item.years }}</span></div>
        </div>
        {% endfor %}

    </div>
</section>
